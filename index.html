<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily News Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════
       THEMES
    ══════════════════════════════════════ */
    :root, [data-theme="dark"] {
      --bg: #0d0f14;
      --surface: #13161e;
      --card: #1a1d27;
      --border: rgba(255,255,255,0.07);
      --text-primary: #f0f2f8;
      --text-secondary: #8a90a8;
      --text-muted: #4a5068;
      --header-bg: rgba(13,15,20,0.85);
      --hero-bg: linear-gradient(135deg,#1a1d27 0%,#13161e 100%);
      --skel-base: #13161e;
      --skel-shine: rgba(255,255,255,0.04);
      --voice-hover-bg: rgba(255,255,255,0.06);
      --voice-hover-border: rgba(255,255,255,0.12);
      --card-hover-border: rgba(255,255,255,0.13);
      --accent: #2ecc71;          /* green accent for dark (subtle) */
      --primary: #e8523a;         /* red for Top Story / ticker */
      --glow1: rgba(232,82,58,0.08);
      --glow2: rgba(58,123,213,0.07);
    }

    [data-theme="light"] {
      --bg: #f4f7f2;
      --surface: #ffffff;
      --card: #ffffff;
      --border: rgba(0,0,0,0.09);
      --text-primary: #111a14;
      --text-secondary: #4a6050;
      --text-muted: #8aaa94;
      --header-bg: rgba(244,247,242,0.92);
      --hero-bg: linear-gradient(135deg,#ffffff 0%,#edf4ea 100%);
      --skel-base: #e8f0e5;
      --skel-shine: rgba(255,255,255,0.7);
      --voice-hover-bg: rgba(46,204,113,0.06);
      --voice-hover-border: rgba(46,204,113,0.3);
      --card-hover-border: rgba(46,204,113,0.35);
      --accent: #1ea85a;
      --primary: #1ea85a;
      --glow1: rgba(30,168,90,0.07);
      --glow2: rgba(46,204,113,0.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── BACKGROUND GLOW ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 10% 0%, var(--glow1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, var(--glow2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 max(1.5rem, calc((100% - 1400px)/2 + 1.5rem));
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 60%, transparent); }
      50%      { box-shadow: 0 0 0 6px transparent; }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }
    #clock {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    #next-refresh {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ── ICON BUTTONS (theme / lang) ── */
    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .ctrl-btn.active-lang {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--accent);
    }

    #refresh-btn {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #refresh-btn:hover {
      background: color-mix(in srgb, var(--primary) 22%, transparent);
      transform: scale(1.03);
    }
    #refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── TICKER ── */
    .ticker-wrap {
      overflow: hidden;
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 18%, transparent);
      border-radius: 10px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      height: 40px;
    }
    .ticker-label {
      flex-shrink: 0;
      padding: 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      border-right: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .ticker-track { flex: 1; overflow: hidden; white-space: nowrap; }
    .ticker-inner {
      display: inline-block;
      animation: ticker 60s linear infinite;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .ticker-inner:hover { animation-play-state: paused; }
    @keyframes ticker {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .ticker-sep { margin: 0 2rem; color: var(--text-muted); }

    /* ── HERO ── */
    .hero-section {
      margin-bottom: 2.5rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: var(--hero-bg);
      transition: background 0.3s;
    }
    .hero-top {
      padding: 2rem 2rem 1.6rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
      border-radius: 6px;
      padding: 4px 10px;
      margin-bottom: 1.1rem;
    }
    .hero-eyebrow-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s ease-in-out infinite;
    }
    .hero-headline {
      font-size: clamp(1.35rem, 3vw, 2.1rem);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 1rem;
      text-decoration: none;
      display: block;
      transition: color 0.2s;
    }
    .hero-headline:hover { color: var(--accent); }
    .hero-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.68;
      max-width: 820px;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .hero-source-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .hero-source-dot { width: 8px; height: 8px; border-radius: 50%; }
    .hero-time { font-size: 0.72rem; color: var(--text-muted); }
    .hero-read-btn {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: gap 0.2s;
      white-space: nowrap;
    }
    .hero-read-btn:hover { gap: 8px; }

    /* ── MEDIA VOICES ── */
    .hero-voices { padding: 1.4rem 2rem 1.8rem; }
    .voices-heading {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .voices-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }
    .voice-card {
      background: color-mix(in srgb, var(--accent) 3%, transparent);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: background 0.2s, border-color 0.2s, transform 0.18s;
    }
    .voice-card:hover {
      background: var(--voice-hover-bg);
      border-color: var(--voice-hover-border);
      transform: translateY(-2px);
    }
    .voice-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .voice-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .voice-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.42;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .voice-time { font-size: 0.67rem; color: var(--text-muted); margin-top: auto; }

    /* ── HERO SKELETON ── */
    .hero-skeleton {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      padding: 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text-primary); }
    .tab-btn.active {
      background: var(--tab-accent, var(--accent));
      border-color: transparent;
      color: #fff;
    }
    .tab-btn .count {
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 0.7rem;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    /* ── CARD ── */
    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) backwards;
      text-decoration: none;
      color: inherit;
    }
    .news-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--tag-color) 15%, transparent);
      color: var(--tag-color);
      border: 1px solid color-mix(in srgb, var(--tag-color) 25%, transparent);
      white-space: nowrap;
    }
    .card-time { font-size: 0.7rem; color: var(--text-muted); }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-source {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-color); }

    /* ── SKELETON ── */
    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel {
      background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-sm    { height: 12px; width: 40%; }
    .skel-title { height: 14px; width: 100%; }
    .skel-title2{ height: 14px; width: 80%; }
    .skel-desc  { height: 11px; width: 100%; }
    .skel-desc2 { height: 11px; width: 65%; }

    /* ── ERROR ── */
    .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .error-msg a { color: var(--primary); }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .header-right { gap: 0.4rem; }
      #clock, #next-refresh { display: none; }
    }
    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      main   { padding: 1rem 1rem 3rem; }
      .news-grid { grid-template-columns: 1fr; }
      .hero-top, .hero-voices { padding: 1.2rem; }
      .voices-grid { grid-template-columns: 1fr; }
      .hero-read-btn { margin-left: 0; }
    }
  </style>
</head>
<body data-theme="dark">

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <span id="logo-text">Daily News Hub</span>
  </div>
  <div class="header-right">
    <div style="text-align:right">
      <div id="clock"></div>
      <div id="next-refresh"></div>
    </div>

    <!-- Language toggle -->
    <button class="ctrl-btn" id="lang-zh-btn" onclick="setLang('zh')" title="中文">中文</button>
    <button class="ctrl-btn active-lang" id="lang-en-btn" onclick="setLang('en')" title="English">EN</button>

    <!-- Theme toggle -->
    <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <button id="refresh-btn" onclick="refreshAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <span id="refresh-label">Refresh</span>
    </button>
  </div>
</header>

<main>
  <!-- TICKER -->
  <div class="ticker-wrap">
    <div class="ticker-label" id="ticker-label">&#9679; Live</div>
    <div class="ticker-track">
      <div class="ticker-inner" id="ticker-text">Loading headlines...</div>
    </div>
  </div>

  <!-- HERO (skeleton while loading) -->
  <div id="hero-container">
    <div class="hero-skeleton">
      <div class="skel skel-sm" style="width:80px;height:20px;border-radius:6px"></div>
      <div class="skel skel-title" style="height:28px;width:92%"></div>
      <div class="skel skel-title" style="height:28px;width:68%"></div>
      <div class="skel skel-desc"></div>
      <div class="skel skel-desc2"></div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- CONTENT -->
  <div id="content"></div>
</main>

<footer id="footer-text">
  News sourced from public RSS feeds via rss2json.com &nbsp;&middot;&nbsp; Auto-refreshes every 10 minutes
</footer>

<script>
// ═══════════════════════════════════════════════
// i18n STRINGS
// ═══════════════════════════════════════════════
const I18N = {
  en: {
    logoText:       'Daily News Hub',
    refresh:        'Refresh',
    live:           '● Live',
    topStory:       'Top Story',
    fullStory:      'Full Story ›',
    mediaCoverage:  'Media Coverage & Related Reports',
    fetchingNews:   'Fetching latest news...',
    noArticles:     'No articles loaded',
    articles:       'articles',
    footerText:     'News sourced from public RSS feeds via rss2json.com · Auto-refreshes every 10 minutes',
    nextRefresh:    (m, s) => `Next: ${m}:${s}`,
    timeJustNow:    'just now',
    timeMin:        m => `${m}m ago`,
    timeHour:       h => `${h}h ago`,
    timeDay:        d => `${d}d ago`,
    feedError:      `Could not load any feeds. This is usually due to the <strong>rss2json.com free-tier rate limit</strong>.<br><br>Fix: <a href="https://rss2json.com/#rss_to_json_home_page" target="_blank">Get a free API key</a> and paste it into <code>RSS2JSON_KEY</code>.`,
    cats: {
      all:      { label: 'All' },
      hk:       { label: 'Hong Kong' },
      cn:       { label: 'China' },
      world:    { label: 'World' },
      tech:     { label: 'Tech' },
      finance:  { label: 'Finance' },
      sport:    { label: 'Sport' },
      politics: { label: 'Politics' },
      war:      { label: 'War & Conflict' },
      analysis: { label: 'Analysis' },
      press:    { label: 'Western Press' },
    },
  },
  zh: {
    logoText:       '每日新聞中心',
    refresh:        '刷新',
    live:           '● 即時',
    topStory:       '頭條新聞',
    fullStory:      '閱讀全文 ›',
    mediaCoverage:  '各媒體報道與相關評論',

function updateCountdown() {
  if (!nextRefreshAt) return;
  const diff = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
  const m = String(Math.floor(diff / 60)).padStart(2, '0');
  const s = String(diff % 60).padStart(2, '0');
  document.getElementById('next-refresh').textContent = t().nextRefresh(m, s);
}
setInterval(updateCountdown, 1000);

// ═══════════════════════════════════════════════
// HERO HEADLINE
// ═══════════════════════════════════════════════
function extractKeywords(title) {
  const stop = new Set([
    'the','a','an','in','on','at','to','of','and','or','is','are','was','were',
    'for','with','this','that','as','from','by','it','its','be','has','have',
    'had','will','would','could','should','not','but','about','after','before',
    'over','than','more','also','their','they','he','she','we','you','our',
    'his','her','into','up','new','says','said','amid',
  ]);
  return title.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w => w.length > 3 && !stop.has(w));
}

function matchScore(title, keywords) {
  const tl = title.toLowerCase();
  return keywords.reduce((s, kw) => s + (tl.includes(kw) ? 1 : 0), 0);
}

function renderHero() {
  const container = document.getElementById('hero-container');
  if (!allArticles.length) return;

  const lead     = allArticles[0];
  const keywords = extractKeywords(lead.title);
  const voices   = allArticles
    .filter(a => a.link !== lead.link)
    .map(a => ({ ...a, score: matchScore(a.title, keywords) }))
    .filter(a => a.score > 0)
    .sort((a, b) => b.score - a.score || new Date(b.pubDate) - new Date(a.pubDate))
    .slice(0, 6);
  const voiceList = voices.length >= 2 ? voices : allArticles.filter(a => a.link !== lead.link).slice(0, 6);

  const rawDesc = stripHtml(lead.description || '');
  const desc    = rawDesc.length > 10
    ? rawDesc.slice(0, 340) + (rawDesc.length > 340 ? '…' : '')
    : (currentLang === 'zh' ? '點擊閱讀完整報道。' : 'Click to read the full story at the source.');

  const s = t();
  container.innerHTML = `
    <div class="hero-section">
      <div class="hero-top">
        <div class="hero-eyebrow">
          <span class="hero-eyebrow-dot"></span>
          ${s.topStory}
        </div>
        <a class="hero-headline" href="${lead.link}" target="_blank" rel="noopener noreferrer">
          ${escHtml(lead.title)}
        </a>
        <p class="hero-desc">${escHtml(desc)}</p>
        <div class="hero-meta">
          <div class="hero-source-badge">
            <span class="hero-source-dot" style="background:${lead.accent}"></span>
            ${escHtml(lead.source)}
          </div>
          <span class="hero-time">${timeAgo(lead.pubDate)}</span>
          <a class="hero-read-btn" href="${lead.link}" target="_blank" rel="noopener noreferrer">
            ${s.fullStory}
          </a>
        </div>
      </div>
      <div class="hero-voices">
        <div class="voices-heading">${s.mediaCoverage}</div>
        <div class="voices-grid">
          ${voiceList.map(a => `
            <a class="voice-card" href="${a.link}" target="_blank" rel="noopener noreferrer">
              <div class="voice-source">
                <span class="voice-dot" style="background:${a.accent}"></span>
                ${escHtml(a.source)}
              </div>
              <div class="voice-title">${escHtml(a.title)}</div>
              <div class="voice-time">${timeAgo(a.pubDate)}</div>
            </a>`).join('')}
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════
function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const label    = t().cats[cat.id]?.label || cat.id;
    const articles = cat.id === 'all' ? allArticles : allArticles.filter(a => a.catId === cat.id);
    const btn      = document.createElement('button');
    btn.className  = 'tab-btn' + (cat.id === activeTab ? ' active' : '');
    btn.style.setProperty('--tab-accent', cat.accent);
    if (cat.id === activeTab) btn.style.background = cat.accent;
    btn.innerHTML  = `${cat.icon} ${label} <span class="count">${articles.length}</span>`;
    btn.onclick    = () => { activeTab = cat.id; renderTabs(); renderContent(); };
    tabsEl.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════
// CONTENT
// ═══════════════════════════════════════════════
function renderContent() {
  const contentEl = document.getElementById('content');
  const articles  = activeTab === 'all' ? allArticles : allArticles.filter(a => a.catId === activeTab);
  const s         = t();

  if (articles.length === 0) {
    contentEl.innerHTML = `
      <div class="section-title">${s.noArticles}</div>
      <div class="news-grid">${[...Array(6)].map(() => skeletonCard()).join('')}</div>`;
    return;
  }

  if (activeTab === 'all') {
    let html = '';
    CATEGORIES.filter(c => c.id !== 'all').forEach(cat => {
      const cats = articles.filter(a => a.catId === cat.id);
      if (!cats.length) return;
      const label = s.cats[cat.id]?.label || cat.id;
      html += `<div class="section-title" style="margin-top:1.8rem">${cat.icon} ${label}</div>`;
      html += `<div class="news-grid">${cats.slice(0, 6).map((a, i) => articleCard(a, i)).join('')}</div>`;
    });
    contentEl.innerHTML = html;
  } else {
    const cat   = CATEGORIES.find(c => c.id === activeTab);
    const label = s.cats[cat.id]?.label || cat.id;
    contentEl.innerHTML = `
      <div class="section-title">${cat.icon} ${label} — ${articles.length} ${s.articles}</div>
      <div class="news-grid">${articles.map((a, i) => articleCard(a, i)).join('')}</div>`;
  }
}

function articleCard(a, index) {
  const delay = (index % 12) * 40;
  const desc  = stripHtml(a.description || '').slice(0, 160);
  return `
    <a class="news-card" href="${a.link}" target="_blank" rel="noopener"
       style="animation-delay:${delay}ms; --tag-color:${a.accent}">
      <div class="card-meta">
        <span class="card-tag">${a.tag}</span>
        <span class="card-time">${timeAgo(a.pubDate)}</span>
      </div>
      <div class="card-title">${escHtml(a.title)}</div>
      ${desc ? `<div class="card-desc">${escHtml(desc)}</div>` : ''}
      <div class="card-source">
        <span class="card-source-dot"></span>
        ${escHtml(a.source)}
      </div>
    </a>`;
}

function skeletonCard() {
  return `
    <div class="skeleton-card">
      <div class="skel skel-sm"></div>
      <div class="skel skel-title"></div>
      <div class="skel skel-title2"></div>
      <div class="skel skel-desc"></div>
      <div class="skel skel-desc2"></div>
    </div>`;
}

// FETCH
// ═══════════════════════════════════════════════
async function fetchFeed(feedCfg, catId, accent) {
  let url = RSS2JSON + encodeURIComponent(feedCfg.url) + `&count=${ITEMS_PER_FEED}`;
  if (RSS2JSON_KEY) url += `&api_key=${RSS2JSON_KEY}`;
  try {
    const r    = await fetch(url, { signal: AbortSignal.timeout(12000) });
    if (!r.ok) { console.warn(`[${feedCfg.name}] HTTP ${r.status}`); return []; }
    const data = await r.json();
    if (data.status !== 'ok') { console.warn(`[${feedCfg.name}] rss2json:`, data.message); return []; }
    return (data.items || []).map(item => ({
      title: item.title || '',
      description: item.description || item.content || '',
      link: item.link || '#',
      pubDate: item.pubDate || new Date().toISOString(),
      source: feedCfg.name,
      tag: feedCfg.tag,
      catId,
      accent,
    }));
  } catch(e) {
    console.warn(`[${feedCfg.name}] fetch error:`, e.message);
    return [];
  }
}

// Detect if a string is mostly Chinese/Japanese/Korean characters
function isCJK(str) {
  const cjk = (str.match(/[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff]/g) || []).length;
  return cjk / Math.max(str.replace(/\s/g,'').length, 1) > 0.25;
}

// Translate a batch of titles via MyMemory free API (no key needed, 5000 chars/day)
async function translateBatch(titles) {
  const results = new Array(titles.length).fill(null);
  // Group into chunks of 10 to avoid overloading
  const CHUNK = 10;
  for (let i = 0; i < titles.length; i += CHUNK) {
    const chunk = titles.slice(i, i + CHUNK);
    await Promise.allSettled(chunk.map(async (title, j) => {
      if (!title || isCJK(title)) { results[i + j] = title; return; }
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(title.slice(0,400))}&langpair=en|zh-TW`;
        const r   = await fetch(url, { signal: AbortSignal.timeout(6000) });
        const d   = await r.json();
        const tr  = d?.responseData?.translatedText;
        results[i + j] = (tr && tr !== title && !tr.toLowerCase().includes('mymemory')) ? tr : title;
      } catch { results[i + j] = title; }
    }));
  }
  return results;
}

async function fetchAll() {
  const lang    = currentLang;
  const promises = [];

  CATEGORIES.filter(c => c.id !== 'all').forEach(cat => {
    // Always fetch the stable English feeds
    (cat.feeds_en || []).forEach(feed => promises.push(fetchFeed(feed, cat.id, cat.accent)));
    // In zh mode, also try Chinese feeds as bonus (failures silently return [])
    if (lang === 'zh') {
      (cat.feeds_zh || []).forEach(feed => promises.push(fetchFeed(feed, cat.id, cat.accent)));
    }
  });

  const results  = await Promise.allSettled(promises);
  const articles = [];
  results.forEach(r => { if (r.status === 'fulfilled') articles.push(...r.value); });
  const seen = new Set();
  const unique = articles.filter(a => {
    if (seen.has(a.link)) return false;
    seen.add(a.link); return true;
  }).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  // In zh mode, translate titles that are still in English (first 50 only to stay within free quota)
  if (lang === 'zh') {
    const toTranslate = unique.slice(0, 50);
    const needTranslate = toTranslate.map(a => isCJK(a.title) ? null : a.title);
    const hasWork = needTranslate.some(x => x !== null);
    if (hasWork) {
      const translated = await translateBatch(needTranslate);
      toTranslate.forEach((a, i) => {
        if (translated[i] && translated[i] !== a.title) a.title = translated[i];
      });
    }
  }

  return unique;
}

async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `<div class="section-title">${t().fetchingNews}</div>
    <div class="news-grid">${[...Array(9)].map(() => skeletonCard()).join('')}</div>`;

  allArticles = await fetchAll();

  if (allArticles.length === 0) {
    contentEl.innerHTML = `<div class="error-msg">${t().feedError}</div>`;
    document.getElementById('hero-container').innerHTML = '';
    renderTabs();   // still update tab labels for current language
    btn.classList.remove('spinning');
    return;
  }

  updateTicker();
  renderHero();
  renderTabs();
  renderContent();
  console.log(`[NewsHub] Loaded ${allArticles.length} articles at ${new Date().toLocaleTimeString()}`);

  btn.classList.remove('spinning');
  clearTimeout(refreshTimer);
  nextRefreshAt = Date.now() + REFRESH_INTERVAL;
  refreshTimer  = setTimeout(refreshAll, REFRESH_INTERVAL);
}

// ═══════════════════════════════════════════════
// TICKER
// ═══════════════════════════════════════════════
function updateTicker() {
  const top = allArticles.slice(0, 20);
  if (!top.length) return;
  document.getElementById('ticker-text').innerHTML =
    top.map(a => `<span>${escHtml(a.title)}</span><span class="ticker-sep">&#9679;</span>`).join('');
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m    = Math.floor(diff / 60000);
  const s    = t();
  if (m < 1)  return s.timeJustNow;
  if (m < 60) return s.timeMin(m);
  const h = Math.floor(m / 60);
  if (h < 24) return s.timeHour(h);
  return s.timeDay(Math.floor(h / 24));
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(s) {
  return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(function init() {
  // Restore preferences
  const savedTheme = localStorage.getItem('theme');
  const savedLang  = localStorage.getItem('lang');
  if (savedTheme && savedTheme !== 'dark') toggleTheme();
  if (savedLang  && savedLang  !== 'en')  {
    currentLang = savedLang;
    document.getElementById('lang-zh-btn').classList.toggle('active-lang', savedLang === 'zh');
    document.getElementById('lang-en-btn').classList.toggle('active-lang', savedLang === 'en');
  }
  applyStaticStrings();
  renderTabs();
  renderContent();
  refreshAll();
})();
</script>
