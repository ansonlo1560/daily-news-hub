<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily News Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════
       THEMES
    ══════════════════════════════════════ */
    :root, [data-theme="dark"] {
      --bg: #0d0f14;
      --surface: #13161e;
      --card: #1a1d27;
      --border: rgba(255,255,255,0.07);
      --text-primary: #f0f2f8;
      --text-secondary: #8a90a8;
      --text-muted: #4a5068;
      --header-bg: rgba(13,15,20,0.85);
      --hero-bg: linear-gradient(135deg,#1a1d27 0%,#13161e 100%);
      --skel-base: #13161e;
      --skel-shine: rgba(255,255,255,0.04);
      --voice-hover-bg: rgba(255,255,255,0.06);
      --voice-hover-border: rgba(255,255,255,0.12);
      --card-hover-border: rgba(255,255,255,0.13);
      --accent: #2ecc71;          /* green accent for dark (subtle) */
      --primary: #e8523a;         /* red for Top Story / ticker */
      --glow1: rgba(232,82,58,0.08);
      --glow2: rgba(58,123,213,0.07);
    }

    [data-theme="light"] {
      --bg: #f4f7f2;
      --surface: #ffffff;
      --card: #ffffff;
      --border: rgba(0,0,0,0.09);
      --text-primary: #111a14;
      --text-secondary: #4a6050;
      --text-muted: #8aaa94;
      --header-bg: rgba(244,247,242,0.92);
      --hero-bg: linear-gradient(135deg,#ffffff 0%,#edf4ea 100%);
      --skel-base: #e8f0e5;
      --skel-shine: rgba(255,255,255,0.7);
      --voice-hover-bg: rgba(46,204,113,0.06);
      --voice-hover-border: rgba(46,204,113,0.3);
      --card-hover-border: rgba(46,204,113,0.35);
      --accent: #1ea85a;
      --primary: #1ea85a;
      --glow1: rgba(30,168,90,0.07);
      --glow2: rgba(46,204,113,0.05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── BACKGROUND GLOW ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 10% 0%, var(--glow1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, var(--glow2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 max(1.5rem, calc((100% - 1400px)/2 + 1.5rem));
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 60%, transparent); }
      50%      { box-shadow: 0 0 0 6px transparent; }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }
    #clock {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    #next-refresh {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ── ICON BUTTONS (theme / lang) ── */
    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .ctrl-btn.active-lang {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--accent);
    }

    #refresh-btn {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #refresh-btn:hover {
      background: color-mix(in srgb, var(--primary) 22%, transparent);
      transform: scale(1.03);
    }
    #refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── TICKER ── */
    .ticker-wrap {
      overflow: hidden;
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 18%, transparent);
      border-radius: 10px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      height: 40px;
    }
    .ticker-label {
      flex-shrink: 0;
      padding: 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      border-right: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .ticker-track { flex: 1; overflow: hidden; white-space: nowrap; }
    .ticker-inner {
      display: inline-block;
      animation: ticker 60s linear infinite;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .ticker-inner:hover { animation-play-state: paused; }
    @keyframes ticker {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .ticker-sep { margin: 0 2rem; color: var(--text-muted); }

    /* ── HERO ── */
    .hero-section {
      margin-bottom: 2.5rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: var(--hero-bg);
      transition: background 0.3s;
    }
    .hero-top {
      padding: 2rem 2rem 1.6rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
      border-radius: 6px;
      padding: 4px 10px;
      margin-bottom: 1.1rem;
    }
    .hero-eyebrow-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s ease-in-out infinite;
    }
    .hero-headline {
      font-size: clamp(1.35rem, 3vw, 2.1rem);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 1rem;
      text-decoration: none;
      display: block;
      transition: color 0.2s;
    }
    .hero-headline:hover { color: var(--accent); }
    .hero-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.68;
      max-width: 820px;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .hero-source-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .hero-source-dot { width: 8px; height: 8px; border-radius: 50%; }
    .hero-time { font-size: 0.72rem; color: var(--text-muted); }
    .hero-read-btn {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: gap 0.2s;
      white-space: nowrap;
    }
    .hero-read-btn:hover { gap: 8px; }

    /* ── MEDIA VOICES ── */
    .hero-voices { padding: 1.4rem 2rem 1.8rem; }
    .voices-heading {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .voices-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .voices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }
    .voice-card {
      background: color-mix(in srgb, var(--accent) 3%, transparent);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: background 0.2s, border-color 0.2s, transform 0.18s;
    }
    .voice-card:hover {
      background: var(--voice-hover-bg);
      border-color: var(--voice-hover-border);
      transform: translateY(-2px);
    }
    .voice-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .voice-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .voice-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.42;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .voice-time { font-size: 0.67rem; color: var(--text-muted); margin-top: auto; }

    /* ── HERO SKELETON ── */
    .hero-skeleton {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      padding: 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text-primary); }
    .tab-btn.active {
      background: var(--tab-accent, var(--accent));
      border-color: transparent;
      color: #fff;
    }
    .tab-btn .count {
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 0.7rem;
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    /* ── CARD ── */
    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) backwards;
      text-decoration: none;
      color: inherit;
    }
    .news-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--tag-color) 15%, transparent);
      color: var(--tag-color);
      border: 1px solid color-mix(in srgb, var(--tag-color) 25%, transparent);
      white-space: nowrap;
    }
    .card-time { font-size: 0.7rem; color: var(--text-muted); }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-source {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .card-source-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tag-color); }

    /* ── SKELETON ── */
    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel {
      background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-sm    { height: 12px; width: 40%; }
    .skel-title { height: 14px; width: 100%; }
    .skel-title2{ height: 14px; width: 80%; }
    .skel-desc  { height: 11px; width: 100%; }
    .skel-desc2 { height: 11px; width: 65%; }

    /* ── ERROR ── */
    .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .error-msg a { color: var(--primary); }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .header-right { gap: 0.4rem; }
      #clock, #next-refresh { display: none; }
    }
    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      main   { padding: 1rem 1rem 3rem; }
      .news-grid { grid-template-columns: 1fr; }
      .hero-top, .hero-voices { padding: 1.2rem; }
      .voices-grid { grid-template-columns: 1fr; }
      .hero-read-btn { margin-left: 0; }
    }
  </style>
</head>
<body data-theme="dark">

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <span id="logo-text">Daily News Hub</span>
  </div>
  <div class="header-right">
    <div style="text-align:right">
      <div id="clock"></div>
      <div id="next-refresh"></div>
    </div>

    <!-- Language toggle -->
    <button class="ctrl-btn" id="lang-zh-btn" onclick="setLang('zh')" title="中文">中文</button>
    <button class="ctrl-btn active-lang" id="lang-en-btn" onclick="setLang('en')" title="English">EN</button>

    <!-- Theme toggle -->
    <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <button id="refresh-btn" onclick="refreshAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <span id="refresh-label">Refresh</span>
    </button>
  </div>
</header>

<main>
  <!-- TICKER -->
  <div class="ticker-wrap">
    <div class="ticker-label" id="ticker-label">&#9679; Live</div>
    <div class="ticker-track">
      <div class="ticker-inner" id="ticker-text">Loading headlines...</div>
    </div>
  </div>

  <!-- HERO (skeleton while loading) -->
  <div id="hero-container">
    <div class="hero-skeleton">
      <div class="skel skel-sm" style="width:80px;height:20px;border-radius:6px"></div>
      <div class="skel skel-title" style="height:28px;width:92%"></div>
      <div class="skel skel-title" style="height:28px;width:68%"></div>
      <div class="skel skel-desc"></div>
      <div class="skel skel-desc2"></div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- CONTENT -->
  <div id="content"></div>
</main>

<footer id="footer-text">
  News sourced from public RSS feeds via rss2json.com &nbsp;&middot;&nbsp; Auto-refreshes every 10 minutes
</footer>

<script>
// ═══════════════════════════════════════════════
// i18n STRINGS
// ═══════════════════════════════════════════════
const I18N = {
  en: {
    logoText:       'Daily News Hub',
    refresh:        'Refresh',
    live:           '● Live',
    topStory:       'Top Story',
    fullStory:      'Full Story ›',
    mediaCoverage:  'Media Coverage & Related Reports',
    fetchingNews:   'Fetching latest news...',
    noArticles:     'No articles loaded',
    articles:       'articles',
    footerText:     'News sourced from public RSS feeds via rss2json.com · Auto-refreshes every 10 minutes',
    nextRefresh:    (m, s) => `Next: ${m}:${s}`,
    timeJustNow:    'just now',
    timeMin:        m => `${m}m ago`,
    timeHour:       h => `${h}h ago`,
    timeDay:        d => `${d}d ago`,
    feedError:      `Could not load any feeds. This is usually due to the <strong>rss2json.com free-tier rate limit</strong>.<br><br>Fix: <a href="https://rss2json.com/#rss_to_json_home_page" target="_blank">Get a free API key</a> and paste it into <code>RSS2JSON_KEY</code>.`,
    cats: {
      all:      { label: 'All' },
      hk:       { label: 'Hong Kong' },
      cn:       { label: 'China' },
      world:    { label: 'World' },
      tech:     { label: 'Tech' },
      finance:  { label: 'Finance' },
      sport:    { label: 'Sport' },
      politics: { label: 'Politics' },
      war:      { label: 'War & Conflict' },
      analysis: { label: 'Analysis' },
      press:    { label: 'Western Press' },
    },
  },
  zh: {
    logoText:       '每日新聞中心',
    refresh:        '刷新',
    live:           '● 即時',
    topStory:       '頭條新聞',
    fullStory:      '閱讀全文 ›',
    mediaCoverage:  '各媒體報道與相關評論',

function extractKeywords(title) {
  const stop = new Set([
    'the','a','an','in','on','at','to','of','and','or','is','are','was','were',
    'for','with','this','that','as','from','by','it','its','be','has','have',
    'had','will','would','could','should','not','but','about','after','before',
    'over','than','more','also','their','they','he','she','we','you','our',
    'his','her','into','up','new','says','said','amid',
  ]);
  return title.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w => w.length > 3 && !stop.has(w));
}

function matchScore(title, keywords) {
  const tl = title.toLowerCase();
  return keywords.reduce((s, kw) => s + (tl.includes(kw) ? 1 : 0), 0);
}

// ═══════════════════════════════════════════════
// FETCH
// ═══════════════════════════════════════════════
async function fetchFeed(url, catId, accent, tag) {
  const api = `${RSS2JSON}${encodeURIComponent(url)}&api_key=${RSS2JSON_KEY}&count=${ITEMS_PER_FEED}`;
  
  // 为每个请求创建超时控制器
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 10_000); // 10 秒超时

  try {
    const res = await fetch(api, { signal: controller.signal });
    clearTimeout(timeoutId); // 请求完成，清除定时器
    const data = await res.json();
    if (data.status === 'ok') {
      return data.items.map(item => ({
        ...item,
        catId,
        accent,
        tag: tag,                     // 补充 tag 字段，否则卡片标签会为空
        source: tag || data.feed.title || 'News',
        description: stripHtml(item.description || item.content || '')
      }));
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      console.warn(`请求超时: ${url}`);
    } else {
      console.error(`Error fetching ${url}:`, e);
    }
  } finally {
    clearTimeout(timeoutId);          // 确保无论成功失败都清除定时器
  }
  return [];
}

// Detect if a string is mostly Chinese/Japanese/Korean characters
function isCJK(str) {
  const cjk = (str.match(/[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff]/g) || []).length;
  return cjk / Math.max(str.replace(/\s/g,'').length, 1) > 0.25;
}

// Translate a single title via MyMemory free API
async function translateTitle(title) {
  if (!title || isCJK(title)) return title;
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(title.slice(0, 400))}&langpair=en|zh-TW`;
    const r   = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const d   = await r.json();
    const tr  = d?.responseData?.translatedText;
    if (tr && tr !== title && !tr.toUpperCase().includes('MYMEMORY') && !tr.toUpperCase().includes('QUOTA')) {
      return tr;
    }
  } catch { /* ignore */ }
  return title;
}

// Translate up to `limit` non-CJK articles in-place, in batches
async function translateArticles(articles, limit = 30) {
  const targets = articles.filter(a => !isCJK(a.title)).slice(0, limit);
  if (!targets.length) return;
  const BATCH = 5;
  for (let i = 0; i < targets.length; i += BATCH) {
    const batch = targets.slice(i, i + BATCH);
    await Promise.allSettled(batch.map(async a => {
      const translated = await translateTitle(a.title);
      if (translated && translated !== a.title) a.title = translated;
    }));
    if (i + BATCH < targets.length) await new Promise(r => setTimeout(r, 200));
  }
}

async function fetchAll() {
  const lang = currentLang;
  let allFetched = [];

  for (const cat of CATEGORIES.filter(c => c.id !== 'all')) {
    let catArticles = [];

    if (lang === 'zh') {
      // 🚀 步驟 1：全力抓取中文來源
      if (cat.feeds_zh && cat.feeds_zh.length > 0) {
        const zhPromises = cat.feeds_zh.map(f => fetchFeed(f.url, cat.id, cat.accent, f.tag));
        const zhResults = await Promise.allSettled(zhPromises);
        zhResults.forEach(r => { if(r.status === 'fulfilled') catArticles.push(...r.value); });
      }

      // 🚀 步驟 2：判斷是否需要英文補貼 (低於 4 篇則啟動備援)
      if (catArticles.length < 4 && cat.feeds_en) {
        console.log(`[${cat.id}] 中文資料不足，正在抓取英文來源補貼...`);
        const enPromises = cat.feeds_en.map(f => fetchFeed(f.url, cat.id, cat.accent, f.tag));
        const enResults = await Promise.allSettled(enPromises);
        enResults.forEach(r => { if(r.status === 'fulfilled') catArticles.push(...r.value); });
      }
    } else {
      // 英文模式：直接抓英文
      const enPromises = cat.feeds_en.map(f => fetchFeed(f.url, cat.id, cat.accent, f.tag));
      const enResults = await Promise.allSettled(enPromises);
      enResults.forEach(r => { if(r.status === 'fulfilled') catArticles.push(...r.value); });
    }

    allFetched.push(...catArticles);
  }

  // 去重與排序
  const seen = new Set();
  const unique = allFetched.filter(a => {
    const key = a.link || a.title;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  // 🚀 步驟 3：如果是在中文模式，翻譯那些「英文原文」的新聞
  if (lang === 'zh') {
    // 篩選出標題不含中文的文章進行翻譯
    const toTranslate = unique.filter(a => !/[\u4e00-\u9fa5]/.test(a.title));
    if (toTranslate.length > 0) {
      await translateArticles(toTranslate, 20); // 這裡需確保你有 translateArticles 函數
    }
  }

  return unique;
}
  
async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `<div class="section-title">${t().fetchingNews}</div>
    <div class="news-grid">${[...Array(9)].map(() => skeletonCard()).join('')}</div>`;

  allArticles = await fetchAll();

  if (allArticles.length === 0) {
    contentEl.innerHTML = `<div class="error-msg">${t().feedError}</div>`;
    document.getElementById('hero-container').innerHTML = '';
    renderTabs();
    btn.classList.remove('spinning');
    return;
  }

  updateTicker();
  renderHero();
  renderTabs();
  renderContent();
  console.log(`[NewsHub] Loaded ${allArticles.length} articles at ${new Date().toLocaleTimeString()}`);

  btn.classList.remove('spinning');
  clearTimeout(refreshTimer);
  nextRefreshAt = Date.now() + REFRESH_INTERVAL;
  refreshTimer  = setTimeout(refreshAll, REFRESH_INTERVAL);
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m    = Math.floor(diff / 60000);
  const s    = t();
  if (m < 1)  return s.timeJustNow;
  if (m < 60) return s.timeMin(m);
  const h = Math.floor(m / 60);
  if (h < 24) return s.timeHour(h);
  return s.timeDay(Math.floor(h / 24));
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(s) {
  return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(function init() {
  const savedTheme = localStorage.getItem('theme');
  const savedLang  = localStorage.getItem('lang');
  if (savedTheme && savedTheme !== 'dark') toggleTheme();
  if (savedLang  && savedLang  !== 'en') {
    currentLang = savedLang;
    document.getElementById('lang-zh-btn').classList.toggle('active-lang', savedLang === 'zh');
    document.getElementById('lang-en-btn').classList.toggle('active-lang', savedLang === 'en');
  }
  applyStaticStrings();
  renderTabs();
  renderContent();
  refreshAll();
})();
</script>
